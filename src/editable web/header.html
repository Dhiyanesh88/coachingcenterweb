  <button class="hamburger" onclick="toggleMenu()">☰</button>
  <div class="menu" id="nav-menu">
    <nav>
      <ul>
        <li><a href="../editable web/coachpage.html">Home</a></li>

<style>
  .headerbg {
    background-color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 100%;
  }
  .headerbg nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .headerbg ul {
    display: flex;
    list-style: none;
    padding: 0;
    gap: 20px;
  }
  .logo {
    width: 100%;
    height: 100%;
    margin-top: 7px;
    margin-left: 40px;
    display: flex;
  }
  .logo img {
    width: 60px;
    height: 60px;
    object-fit: cover;
  }
  .hamburger {
    display: none;
    font-size: 26px;
    background: none;
    border: none;
    cursor: pointer;
    margin-left: auto;
  }
  .menu {
    display: flex;
    align-items: center;
    flex-grow: 1;
    flex-shrink: 1;
    justify-content: flex-end;
  }
  .menu li {
    padding: 0 25px;
    font-size: 16px;
  }
  .menu li a {
    text-decoration: none;
    font-weight: 500;
    color: #000;
  }
  @media (max-width: 992px) {
    .headerbg {
      width: 100%;
      max-width: 100%;
    }
  }
  @media (max-width: 768px) {
    .hamburger {
      display: block;
    }
    .menu {
      display: none;
      width: 100%;
    }
    .menu.open {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding-top: 10px;
    }
    .menu nav {
      flex-direction: column;
      align-items: flex-start;
      width: 100%;
    }
    .menu ul {
      flex-direction: column;
      gap: 10px;
      width: 100%;
      padding-left: 0;
    }
    .menu li {
      padding: 10px 20px;
      width: 100%;
    }
    .freeguideframe {
      margin: 10px 20px;
      align-self: flex-start;
    }
  }
  .freeguideframe {
    width: 190px;
    height: 45px;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #20ad96;
    border: none;
    color: white;
    border-radius: 8px;
    padding: 10px;
    font-size: 13px;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 0.3s ease;

  }
</style>
<script>
  function toggleMenu() {
    document.getElementById('nav-menu').classList.toggle('open');
  }
</script>
